openapi: 3.0.3
info:
  title: Kennwerk
  version: 0.1.0
  description: >-
    Measurement workbench for national AI capability. Indicators are bound to ecosystem
    building blocks, versioned, and typed leading or lagging with an expected lag horizon.
    Observations carry a derivation method and a confidence grade; figures reconstructed
    from programmes that are not ai-specific carry a second-reviewed attribution share.
    Cross-country use is gated by a comparability assessment and ranking language is
    refused below the comparable grade. Gaps are priced against named comparator unit
    benchmarks, causal claims require a counterfactual basis, and publication runs through
    frozen methods releases, explicit restatements and traceable evidence packs.
  x-product-slug: ai-gov-kennwerk
  x-source: ai-in-gov/Outline_for_a_German_Artificial_Intelligence_Strategy/
servers:
  - url: https://api.example.com
tags:
  - name: Indicators
    description: Building blocks, versioned indicator definitions, and lag horizons
  - name: Observations
    description: Figures with derivation method, confidence grade, and disclosure state
  - name: Attribution
    description: Funding programmes, AI attribution shares, and cost assumptions
  - name: Comparability
    description: Comparator jurisdictions, alignment grading, and ranking refusal
  - name: Gaps
    description: Quantified capability gaps and costed closure estimates
  - name: Claims
    description: Causal versus association-only attribution claims
  - name: Talent
    description: Aggregated senior researcher movements and returnee programmes
  - name: Dependency
    description: Compute, hardware, and cloud dependency exposures
  - name: Coverage
    description: Federal-state coverage submissions and the indicator gap register
  - name: Publication
    description: Methods releases, restatements, evidence packs, and assessment reports
paths:
  /v1/building-blocks:
    get:
      operationId: listBuildingBlocks
      tags: [Indicators]
      summary: List ecosystem building blocks and their indicator coverage
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: hasLeadingIndicator
          in: query
          description: Filter to building blocks with or without any leading indicator
          schema:
            type: boolean
      responses:
        "200":
          description: Building blocks page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeBuildingBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerBuildingBlock
      tags: [Indicators]
      summary: Register an ecosystem building block of the national strategy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingBlockCreate"
      responses:
        "201":
          description: Building block registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBuildingBlock"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/indicators:
    get:
      operationId: listIndicatorDefinitions
      tags: [Indicators]
      summary: List indicator definitions with building block and lag type
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: buildingBlockId
          in: query
          schema:
            type: string
        - name: indicatorType
          in: query
          schema:
            $ref: "#/components/schemas/IndicatorType"
      responses:
        "200":
          description: Indicator definitions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeIndicatorDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createIndicatorDefinition
      tags: [Indicators]
      summary: Define an indicator against a building block with its expected lag
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndicatorDefinitionCreate"
      responses:
        "201":
          description: Indicator defined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIndicatorDefinition"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/indicators/{indicatorId}:
    parameters:
      - $ref: "#/components/parameters/IndicatorId"
    get:
      operationId: getIndicatorDefinition
      tags: [Indicators]
      summary: Retrieve an indicator definition with its current version
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Indicator definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIndicatorDefinition"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/indicators/{indicatorId}/versions:
    parameters:
      - $ref: "#/components/parameters/IndicatorId"
    get:
      operationId: listIndicatorVersions
      tags: [Indicators]
      summary: List versions of an indicator definition with effective dates
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Indicator versions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeIndicatorVersion"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: publishIndicatorVersion
      tags: [Indicators]
      summary: Publish a new indicator version with its stated effect on the series
      description: >-
        Redefining what counts under an indicator produces a successor version with an
        effective date and a stated series effect, and requires a restatement where any
        published figure is affected.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndicatorVersionCreate"
      responses:
        "201":
          description: Version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIndicatorVersion"
        "409":
          description: Refused because affected published figures have no restatement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/derivation-methods:
    get:
      operationId: listDerivationMethods
      tags: [Observations]
      summary: List the permitted derivation methods for an observation
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Derivation methods page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDerivationMethod"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/confidence-grades:
    get:
      operationId: listConfidenceGrades
      tags: [Observations]
      summary: List the fixed confidence scale and the evidence each grade requires
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Confidence grades page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeConfidenceGrade"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/observations:
    get:
      operationId: listObservations
      tags: [Observations]
      summary: List observations with method, confidence, and disclosure state
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: indicatorId
          in: query
          schema:
            type: string
        - name: derivationMethodCode
          in: query
          schema:
            $ref: "#/components/schemas/DerivationMethodCode"
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Observations page with suppression applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeObservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createObservation
      tags: [Observations]
      summary: Record an observation with its derivation method and inputs
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationCreate"
      responses:
        "201":
          description: Observation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObservation"
        "422":
          description: Rejected because method, inputs, or attribution link are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/{observationId}:
    parameters:
      - $ref: "#/components/parameters/ObservationId"
    get:
      operationId: getObservation
      tags: [Observations]
      summary: Retrieve an observation with everything needed to reproduce it
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObservation"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/observations/{observationId}/confidence-grade:
    parameters:
      - $ref: "#/components/parameters/ObservationId"
    put:
      operationId: assignConfidenceGrade
      tags: [Observations]
      summary: Assign or revise the confidence grade on an observation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfidenceGradeAssignment"
      responses:
        "200":
          description: Grade assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeObservation"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/funding-programmes:
    get:
      operationId: listFundingProgrammes
      tags: [Attribution]
      summary: List funding programmes with budget and stated AI relevance
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: aiSpecific
          in: query
          description: Filter to programmes whose stated purpose is AI, or those that are not
          schema:
            type: boolean
      responses:
        "200":
          description: Funding programmes page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFundingProgramme"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerFundingProgramme
      tags: [Attribution]
      summary: Register a funding programme and whether its topic description names AI
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundingProgrammeCreate"
      responses:
        "201":
          description: Programme registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFundingProgramme"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/attribution-shares:
    get:
      operationId: listAttributionShares
      tags: [Attribution]
      summary: List AI attribution shares with basis and review state
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: programmeId
          in: query
          schema:
            type: string
        - name: reviewStatus
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
      responses:
        "200":
          description: Attribution shares page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAttributionShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAttributionShare
      tags: [Attribution]
      summary: Propose an AI attribution share for a programme with its basis
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionShareCreate"
      responses:
        "201":
          description: Share proposed and awaiting second review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAttributionShare"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/attribution-shares/{shareId}/second-review:
    parameters:
      - $ref: "#/components/parameters/ShareId"
    post:
      operationId: recordSecondReview
      tags: [Attribution]
      summary: Record the second named analyst's review of an attribution share
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondReviewCreate"
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAttributionShare"
        "409":
          description: Refused because the reviewer is the proposing analyst
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/attribution-shares/{shareId}/revisions:
    parameters:
      - $ref: "#/components/parameters/ShareId"
    post:
      operationId: reviseAttributionShare
      tags: [Attribution]
      summary: Revise an attribution basis and recompute every dependent figure
      description: >-
        Changing a basis recomputes all observations derived from the share and opens a
        restatement naming the affected series, so a correction to one programme cannot
        leave published totals inconsistent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionShareRevision"
      responses:
        "201":
          description: Revision applied with dependent figures recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRecomputationResult"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/cost-assumptions:
    get:
      operationId: listCostAssumptions
      tags: [Attribution]
      summary: List recorded cost assumptions used to convert spend into capacity
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cost assumptions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCostAssumption"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCostAssumption
      tags: [Attribution]
      summary: Record a cost assumption such as annual personnel cost per researcher
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostAssumptionCreate"
      responses:
        "201":
          description: Assumption recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCostAssumption"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/cost-assumptions/{assumptionId}/headcount-conversions:
    parameters:
      - $ref: "#/components/parameters/AssumptionId"
    post:
      operationId: convertSpendToHeadcount
      tags: [Attribution]
      summary: Convert a spend estimate into headcount under a recorded assumption
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeadcountConversionRequest"
      responses:
        "200":
          description: Conversion with the assumption and confidence carried through
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHeadcountConversion"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/comparator-jurisdictions:
    get:
      operationId: listComparatorJurisdictions
      tags: [Comparability]
      summary: List comparator jurisdictions and institutions used in comparisons
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Comparators page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeComparatorJurisdiction"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerComparatorJurisdiction
      tags: [Comparability]
      summary: Register a comparator jurisdiction with its definition source
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparatorJurisdictionCreate"
      responses:
        "201":
          description: Comparator registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeComparatorJurisdiction"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/comparability-assessments:
    get:
      operationId: listComparabilityAssessments
      tags: [Comparability]
      summary: List comparability assessments with their grade
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: indicatorId
          in: query
          schema:
            type: string
        - name: grade
          in: query
          schema:
            $ref: "#/components/schemas/ComparabilityGrade"
      responses:
        "200":
          description: Assessments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeComparabilityAssessment"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createComparabilityAssessment
      tags: [Comparability]
      summary: Grade whether definitions, coverage, and periods align with a comparator
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparabilityAssessmentCreate"
      responses:
        "201":
          description: Assessment graded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeComparabilityAssessment"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/comparability-assessments/{assessmentId}:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    get:
      operationId: getComparabilityAssessment
      tags: [Comparability]
      summary: Retrieve a comparability assessment with its alignment findings
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeComparabilityAssessment"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/comparability-assessments/ranking-attempts:
    post:
      operationId: attemptRanking
      tags: [Comparability]
      summary: Attempt a ranking and receive a refusal where grade is below comparable
      description: >-
        A league-table form is refused for any comparison graded indicative or not
        comparable; the refusal names the failing alignment dimension and offers the
        permitted indicative form instead.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RankingAttempt"
      responses:
        "200":
          description: Ranking permitted or refused with the offered alternative form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRankingRefusal"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/unit-benchmarks:
    get:
      operationId: listUnitBenchmarks
      tags: [Comparability]
      summary: List unit benchmarks drawn from named institutes and initiatives
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Unit benchmarks page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeUnitBenchmark"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createUnitBenchmark
      tags: [Comparability]
      summary: Record a unit benchmark such as the funding level of a named institute
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitBenchmarkCreate"
      responses:
        "201":
          description: Benchmark recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeUnitBenchmark"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/capability-gaps:
    get:
      operationId: listCapabilityGaps
      tags: [Gaps]
      summary: List capability gaps with distance to a named comparator
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: buildingBlockId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/GapStatus"
      responses:
        "200":
          description: Capability gaps page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCapabilityGap"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCapabilityGap
      tags: [Gaps]
      summary: Open a gap as a quantified distance on a named indicator
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityGapCreate"
      responses:
        "201":
          description: Gap opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapabilityGap"
        "409":
          description: Refused because the underlying comparison is not graded comparable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/capability-gaps/{gapId}/closure-estimates:
    parameters:
      - $ref: "#/components/parameters/GapId"
    get:
      operationId: listClosureEstimates
      tags: [Gaps]
      summary: List costed closure estimates for a gap
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Closure estimates page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeClosureEstimate"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: priceGapClosure
      tags: [Gaps]
      summary: Price a gap closure from a recorded unit benchmark
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosureEstimateCreate"
      responses:
        "201":
          description: Closure estimate recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeClosureEstimate"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/attribution-claims:
    get:
      operationId: listAttributionClaims
      tags: [Claims]
      summary: List claims split between causal and association only
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: claimType
          in: query
          schema:
            $ref: "#/components/schemas/ClaimType"
      responses:
        "200":
          description: Attribution claims page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAttributionClaim"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAttributionClaim
      tags: [Claims]
      summary: Assert an outcome claim, with a counterfactual basis if it is causal
      description: >-
        A claim submitted as causal without a stated counterfactual basis is stored and
        published as association only, and the downgrade is recorded.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionClaimCreate"
      responses:
        "201":
          description: Claim recorded, possibly downgraded to association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAttributionClaim"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/talent-movements:
    get:
      operationId: listTalentMovements
      tags: [Talent]
      summary: List aggregated senior movements with cell-size suppression applied
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
