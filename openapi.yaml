components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Register harvesters, state submission clients, and released-series consumers
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Named analysts, methodologists, and reviewers whose acts are attributed
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IndicatorId:
      name: indicatorId
      in: path
      required: true
      schema:
        type: string
    ObservationId:
      name: observationId
      in: path
      required: true
      schema:
        type: string
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
    AssumptionId:
      name: assumptionId
      in: path
      required: true
      schema:
        type: string
    GapId:
      name: gapId
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        methodsReleaseId:
          type: string
          description: Frozen methods release the response was computed against
        suppressionApplied:
          type: boolean
          description: True where any cell in the response was suppressed for size
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        failingDimension:
          type: string
          description: Alignment or evidence dimension that caused a refusal
        offeredAlternative:
          type: string
          description: Permitted weaker form, where one exists
    IndicatorType:
      type: string
      enum: [leading, lagging]
    DerivationMethodCode:
      type: string
      enum:
        - direct_measurement
        - programme_reconstruction
        - survey
        - expert_estimate
        - external_citation
    ConfidenceGradeCode:
      type: string
      description: Fixed scale from measured through to indicative expert judgement
      enum: [measured, robust, likely, indicative, insufficient_data]
    ReviewStatus:
      type: string
      enum: [proposed, second_review_pending, accepted, rejected, revised]
    ComparabilityGrade:
      type: string
      enum: [comparable, indicative, not_comparable]
    GapStatus:
      type: string
      enum: [open, priced, closing, closed]
    ClaimType:
      type: string
      enum: [causal, association]
    MovementDirection:
      type: string
      enum: [inbound, outbound]
    DestinationClass:
      type: string
      enum:
        - domestic_academic
        - domestic_corporate_lab
        - foreign_academic
        - foreign_corporate_lab
        - public_sector
    AssetClass:
      type: string
      enum: [compute, hardware, cloud, foundation_model]
    CoverageState:
      type: string
      enum: [submitted, estimated, missing]
    DisclosureState:
      type: string
      enum: [publishable, aggregate_only, restricted, embargoed]
    RequestorClass:
      type: string
      enum: [parliamentary_inquiry, ministerial_brief, external_citation, peer_review]
    BuildingBlock:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        indicatorCount:
          type: integer
        leadingIndicatorCount:
          type: integer
        openGapEntryCount:
          type: integer
    BuildingBlockCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    IndicatorDefinition:
      type: object
      required: [id, buildingBlockId, name, indicatorType]
      properties:
        id:
          type: string
        buildingBlockId:
          type: string
        name:
          type: string
        indicatorType:
          $ref: "#/components/schemas/IndicatorType"
        expectedLagYears:
          type: integer
          description: Years before a change in policy could show in this indicator
        unit:
          type: string
        jurisdictionLevel:
          type: string
          enum: [national, state, institutional]
        currentVersionId:
          type: string
        status:
          type: string
          enum: [draft, published, retired]
    IndicatorDefinitionCreate:
      type: object
      required: [buildingBlockId, name, indicatorType, expectedLagYears]
      properties:
        buildingBlockId:
          type: string
        name:
          type: string
        indicatorType:
          $ref: "#/components/schemas/IndicatorType"
        expectedLagYears:
          type: integer
        unit:
          type: string
        jurisdictionLevel:
          type: string
          enum: [national, state, institutional]
    IndicatorVersion:
      type: object
      required: [id, indicatorId, versionLabel, effectiveFrom]
      properties:
        id:
          type: string
        indicatorId:
          type: string
        versionLabel:
          type: string
        effectiveFrom:
          type: string
          format: date
        definitionText:
          type: string
        seriesEffect:
          type: string
          description: Stated effect of the redefinition on the existing series
        restatementId:
          type: string
        supersedesVersionId:
          type: string
    IndicatorVersionCreate:
      type: object
      required: [versionLabel, effectiveFrom, definitionText, seriesEffect]
      properties:
        versionLabel:
          type: string
        effectiveFrom:
          type: string
          format: date
        definitionText:
          type: string
        seriesEffect:
          type: string
        restatementId:
          type: string
    DerivationMethod:
      type: object
      required: [code, label]
      properties:
        code:
          $ref: "#/components/schemas/DerivationMethodCode"
        label:
          type: string
        requiredInputs:
          type: array
          items:
            type: string
        maximumConfidenceGrade:
          $ref: "#/components/schemas/ConfidenceGradeCode"
    ConfidenceGrade:
      type: object
      required: [code, label]
      properties:
        code:
          $ref: "#/components/schemas/ConfidenceGradeCode"
        label:
          type: string
        evidenceRequired:
          type: string
        publishableAsHeadline:
          type: boolean
    ConfidenceGradeAssignment:
      type: object
      required: [grade, rationale]
      properties:
        grade:
          $ref: "#/components/schemas/ConfidenceGradeCode"
        rationale:
          type: string
        assignedBy:
          type: string
    Observation:
      type: object
      required: [id, indicatorId, value, derivationMethodCode]
      properties:
        id:
          type: string
        indicatorId:
          type: string
        indicatorVersionId:
          type: string
        period:
          type: string
        value:
          type: number
        unit:
          type: string
        derivationMethodCode:
          $ref: "#/components/schemas/DerivationMethodCode"
        inputs:
          type: array
          description: Sources and intermediate figures the value was derived from
          items:
            type: object
            properties:
              label:
                type: string
              sourceReference:
                type: string
              value:
                type: number
        confidenceGrade:
          $ref: "#/components/schemas/ConfidenceGradeCode"
        disclosureState:
          $ref: "#/components/schemas/DisclosureState"
        attributionShareIds:
          type: array
          items:
            type: string
        jurisdictionCoverageId:
          type: string
        suppressed:
          type: boolean
        methodsReleaseId:
          type: string
    ObservationCreate:
      type: object
      required: [indicatorId, period, value, derivationMethodCode]
      properties:
        indicatorId:
          type: string
        indicatorVersionId:
          type: string
        period:
          type: string
        value:
          type: number
        unit:
          type: string
        derivationMethodCode:
          $ref: "#/components/schemas/DerivationMethodCode"
        inputs:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              sourceReference:
                type: string
              value:
                type: number
        confidenceGrade:
          $ref: "#/components/schemas/ConfidenceGradeCode"
        disclosureState:
          $ref: "#/components/schemas/DisclosureState"
        attributionShareIds:
          type: array
          items:
            type: string
    FundingProgramme:
      type: object
      required: [id, name, totalBudget]
      properties:
        id:
          type: string
        name:
          type: string
        fundingBody:
          type: string
        totalBudget:
          type: number
        currency:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        aiSpecific:
          type: boolean
          description: True where AI is the stated purpose of the programme
        topicKeywordsMentionAi:
          type: boolean
          description: >-
            False where the funded-topic description does not contain the keywords for
            artificial intelligence or machine learning, which forces reconstruction
        sourceReference:
          type: string
    FundingProgrammeCreate:
      type: object
      required: [name, totalBudget, aiSpecific]
      properties:
        name:
          type: string
        fundingBody:
          type: string
        totalBudget:
          type: number
        currency:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        aiSpecific:
          type: boolean
        topicKeywordsMentionAi:
          type: boolean
        sourceReference:
          type: string
    AttributionShare:
      type: object
      required: [id, programmeId, share, basis, reviewStatus]
      properties:
        id:
          type: string
        programmeId:
          type: string
        share:
          type: number
          minimum: 0
          maximum: 1
        basis:
          type: string
          enum:
            - project_level_review
            - keyword_absence
            - programme_officer_statement
            - expert_judgement
        basisNotes:
          type: string
        proposedBy:
          type: string
        reviewStatus:
          $ref: "#/components/schemas/ReviewStatus"
        secondReview:
          $ref: "#/components/schemas/SecondReview"
        confidenceGrade:
          $ref: "#/components/schemas/ConfidenceGradeCode"
        versionLabel:
          type: string
    AttributionShareCreate:
      type: object
      required: [programmeId, share, basis]
      properties:
        programmeId:
          type: string
        share:
          type: number
          minimum: 0
          maximum: 1
        basis:
          type: string
          enum:
            - project_level_review
            - keyword_absence
            - programme_officer_statement
            - expert_judgement
        basisNotes:
          type: string
        proposedBy:
          type: string
    SecondReview:
      type: object
      required: [reviewerId, outcome]
      properties:
        reviewerId:
          type: string
        outcome:
          type: string
          enum: [accepted, rejected, accepted_with_revision]
        reviewedAt:
          type: string
          format: date-time
        comment:
          type: string
    SecondReviewCreate:
      type: object
      required: [reviewerId, outcome]
      properties:
        reviewerId:
          type: string
        outcome:
          type: string
          enum: [accepted, rejected, accepted_with_revision]
        comment:
          type: string
    AttributionShareRevision:
      type: object
      required: [share, basis, reason]
      properties:
        share:
          type: number
          minimum: 0
          maximum: 1
        basis:
          type: string
          enum:
            - project_level_review
            - keyword_absence
            - programme_officer_statement
            - expert_judgement
        reason:
          type: string
        openRestatement:
          type: boolean
          default: true
    RecomputationResult:
      type: object
      required: [shareId, recomputedObservationIds]
      properties:
        shareId:
          type: string
        recomputedObservationIds:
          type: array
          items:
            type: string
        restatementId:
          type: string
        largestAbsoluteChange:
          type: number
        affectedIndicatorIds:
          type: array
          items:
            type: string
    CostAssumption:
      type: object
      required: [id, label, value]
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: number
        unit:
          type: string
        currency:
          type: string
        effectiveFrom:
          type: string
          format: date
        sourceReference:
          type: string
    CostAssumptionCreate:
      type: object
      required: [label, value, unit]
      properties:
        label:
          type: string
        value:
          type: number
        unit:
          type: string
        currency:
          type: string
        effectiveFrom:
          type: string
          format: date
        sourceReference:
          type: string
